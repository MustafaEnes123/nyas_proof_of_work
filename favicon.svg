<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Radial ambient glow -->
    <radialGradient id="tabBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2C221A"/>
      <stop offset="100%" stop-color="#160F0B"/>
    </radialGradient>
    <linearGradient id="geomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2A14E"/>
      <stop offset="50%" stop-color="#B65434"/>
      <stop offset="100%" stop-color="#4B6B54"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="14" fill="url(#tabBg)"/>
  
  <!-- Outer Blueprint Precision Ring -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#E2D4C1" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="3, 2"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#E2A14E" stroke-width="1.5" stroke-opacity="0.75"/>

  <!-- Concentric Geometric Inscribed Hexagon & Diamond -->
  <!-- Inner Diamond -->
  <polygon points="32,13 51,32 32,51 13,32" fill="none" stroke="#B65434" stroke-width="1.8"/>

  <!-- Inscribed Dynamic Triangle -->
  <polygon points="32,16 47,44 17,44" fill="none" stroke="url(#geomGrad)" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Geometric Neural Center Node -->
  <circle cx="32" cy="32" r="5" fill="#EFE8DC" stroke="#B65434" stroke-width="1.8"/>
  <circle cx="32" cy="32" r="2" fill="#B65434"/>

  <!-- Outer Apex Satellites -->
  <circle cx="32" cy="16" r="2.2" fill="#E2A14E"/>
  <circle cx="47" cy="44" r="2.2" fill="#4B6B54"/>
  <circle cx="17" cy="44" r="2.2" fill="#B65434"/>

  <!-- Crosshairs / Drafting Ticks -->
  <line x1="32" y1="5" x2="32" y2="10" stroke="#E2D4C1" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="32" y1="54" x2="32" y2="59" stroke="#E2D4C1" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="5" y1="32" x2="10" y2="32" stroke="#E2D4C1" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="54" y1="32" x2="59" y2="32" stroke="#E2D4C1" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
</svg>
